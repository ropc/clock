[package]
edition = "2024"
name = "clock"
version = "0.1.0"
authors = ["ropc <1666878+ropc@users.noreply.github.com>"]
resolver = "2"

[[bin]]
name = "clock"
test = false
bench = false

[dependencies]
defmt = "1.0"
defmt-rtt = "1.1"
panic-probe = { version = "1.0", features = ["print-defmt"] }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-storage = "0.3.1"
cortex-m-rt = "0.7.3"

embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "defmt", "executor-interrupt"] }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-net = { version = "0.9", features = ["defmt", "icmp", "dhcpv4", "tcp", "udp", "dns", "proto-ipv4", "medium-ethernet" ] }

cortex-m = { version = "0.7.7" }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa"] }

cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"] }
cyw43-pio = { version = "0.10.0", features = ["defmt"] }
static_cell = "2.1.1"
sntpc = { version = "0.11.0", features = ["defmt"] }
apds9960 = "0.1.0"

[profile.release]
debug = 2
lto = true
opt-level = 'z'

[profile.dev]
debug = 2
lto = true
opt-level = "z"
